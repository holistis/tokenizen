        <h1>Tokenizen: bewijs van levering voor de AI-agent-economie</h1>
        <p>
          Tokenizen bouwt open-source infrastructuur voor de verkoperskant van de AI-agent-economie: een
          verifieerbaar bewijs dat een verkoper een recht echt heeft, en dat wat geleverd is overeenkomt met wat
          beloofd was.
        </p>
        <h2>Capacity Attest</h2>
        <p>
          Wanneer een AI-agent via het x402-protocol betaalt voor capaciteit (GPU-uren, opslag, API-credits,
          bandbreedte) bij een andere agent, laat de betalende agent na afwikkeling een cryptografisch ondertekende
          claim achter of het geleverde overeenkwam met wat beloofd was. Andere agents kunnen die geschiedenis
          opvragen vóórdat ze zaken doen met een verkoper.
        </p>
        <p><a href="https://github.com/holistis/tokenizen">Bekijk de code op GitHub</a></p>
