    <!-- The page text inside #root (written at build time, see scripts/prerender-heads.mjs) is for readers that do not run JavaScript.
         While JavaScript runs it stays off screen until the app replaces it; without JavaScript it is the page. -->
    <script>
      document.documentElement.className += " js";
    </script>
    <style>
      .js #prerender {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>

    <!-- Thema vóór eerste paint zetten (voorkomt flits van verkeerd thema) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("tokenizen-theme");
          var root = document.documentElement;
          if (stored === "dark") root.classList.add("dark");
          else if (stored === "light") root.classList.add("light");
        } catch (e) {
          /* localStorage niet beschikbaar (privémodus e.d.), val terug op systeemvoorkeur via CSS */
        }
      })();
    </script>
