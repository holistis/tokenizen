<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768" role="img" aria-label="Four horizontal bars. The leader's report 80.6 percent, six of our research runs together 77.4 percent, one research run 71.0 percent, all on seven audits, and the scan you can buy 70.0 percent on five audits."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="0.6" stop-color="#0d1530"/><stop offset="1" stop-color="#111a3a"/></linearGradient>
