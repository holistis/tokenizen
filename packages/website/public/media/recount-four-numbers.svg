1120" y="458" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#7f93b5">24 of 31</text><text x="90" y="500" font-family="system-ui, Segoe UI, sans-serif" font-size="26" fill="#dbe7ff">One of our research runs</text><text x="1090" y="500" text-anchor="end" font-family="system-ui, Segoe UI, sans-serif" font-size="20" fill="#7f93b5">7 audits, the same judge copy</text><rect x="90" y="514" width="1000" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"/><rect x="90" y="514" width="709.7" height="34" rx="17" fill="#93a8d6"/><text x="1120" y="542" font-family="ui-monospace, Consolas, monospace" font-size="30" fill="#93a8d6">71.0%</text><text x="1120" y="568" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#7f93b5">22 of 31</text><text x="90" y="610" font-family="system-ui, Segoe UI, sans-serif" font-size="26" fill="#dbe7ff">Our smart contract scan, as sold</text><text x="1090" y="610" text-anchor="end" font-family="system-ui, Segoe UI, sans-serif" font-size="20" fill="#7f93b5">5 audits, one run each</text><rect x="90" y="624" width="1000" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"/><rect x="90" y="624" width="700.0" height="34" rx="17" fill="#5eead4" filter="url(#glow)"/><text x="1120" y="652" font-family="ui-monospace, Consolas, monospace" font-size="30" fill="#5eead4">70.0%</text><text x="1120" y="678" font-family="ui-monospace, Consolas, monospace" font-size="18" fill="#7f93b5">14 of 20</text><text x="90" y="716" font-family="system-ui, Segoe UI, sans-serif" font-size="21" fill="#7f93b5">Different sets: the first three bars are seven audits, the last one five. Read each bar on its own. Recount: node check.mjs in each folder.</text></svg>
