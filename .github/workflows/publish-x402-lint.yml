name: Publish x402-lint

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/x402-lint/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/x402-lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing + provenance need npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      # x402-lint imports tokenizen-net-guard. Its dist/ is gitignored build
      # output, not checked in, so a fresh checkout has no dist/ for npm's
      # workspace link to point at until net-guard builds itself first. This
      # exact class of bug (ci.yml's own comment history: self-check-server
      # vs trust-attest-server, then net-guard itself) already happened twice
      # in ci.yml before this workflow existed — same fix, same reason.
      - name: Build tokenizen-net-guard first (x402-lint imports its dist/)
        working-directory: .
        run: npm run build -w tokenizen-net-guard

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Same trap as publish-net-guard.yml (see its comment): trusted publishing
      # cannot create a brand new package name, only authenticate an already-
      # published one with a configured repo+workflow link. x402-lint depends
      # on tokenizen-net-guard, which must already be resolvable on npm before
      # this publish is attempted, or this ships an uninstallable package.
      - name: Refuse to publish if our own dependencies are missing from npm
        working-directory: .
        run: node scripts/check-own-deps-published.mjs --package=@alghanima/x402-lint

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
