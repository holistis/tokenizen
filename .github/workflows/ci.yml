name: CI

on:
  push:
  pull_request:

# Least privilege by default. Without an explicit block a workflow inherits the
# repository default, which is usually write, and a compromised action in any
# step would inherit it too. This job only reads code.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root + all workspaces)
        run: npm ci

      # `npm run build --workspaces` builds packages in filesystem/glob order
      # (alphabetical), NOT dependency order. self-check-server imports directly from
      # trust-attest-server's dist output, but "s" < "t" alphabetically, so the blanket
      # command alone built self-check-server before trust-attest-server existed,
      # breaking CI since 2026-09-29 09:44 UTC. Confirmed locally: rm -rf the dist
      # folders and rebuild in blanket order reproduces the exact "Cannot find module
      # 'trust-attest-server/dist/server.js'" error.
      # Fix: build the known cross-workspace dependency chain explicitly, in order,
      # first. The blanket call after still covers every other/future workspace
      # (self-check-server's second build is a fast, harmless no-op since it's already
      # built) -- add any NEW package with a cross-workspace dist import to the
      # explicit list above the blanket call, in dependency order.
      #
      # That instruction was then missed exactly as written: net-guard landed as a new
      # shared package without being added here, so trust-attest-server failed on
      # "Cannot find module 'net-guard'" from the moment it was merged. net-guard goes
      # FIRST because it depends on no other workspace and the other three import it.
      # Reproduced locally by deleting every dist/ and replaying the old order, which
      # gave the identical two TS2307 errors CI reported.
      - name: Build workspaces (dependency order first, then the rest)
        run: |
          npm run build -w tokenizen-net-guard --if-present
          npm run build -w capacity-attest --if-present
          npm run build -w endpoint-attest --if-present
          npm run build -w trust-attest-server --if-present
          npm run build --workspaces --if-present

      # Same pattern for "test": only capacity-attest has one today,
      # any future package with a test script is picked up automatically.
      - name: Test workspaces
        run: npm test --workspaces --if-present

      # The own-dependency guard lives outside any workspace, so the blanket test
      # command above would never reach it. A gate nobody runs is a gate that rots.
      - name: Test the own-dependency guard
        run: npm run check-own-deps-test
