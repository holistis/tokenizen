name: Site-wacht

# The watcher of tokenizen.nl from the outside. It reads our own addresses (scripts/diensten.json) with GET requests and nothing else: no secret,
# no payment, no write access, no secret of ours (the only token is the read-only one GitHub gives every run, and it is sent to api.github.com only). It runs in GitHub Actions, so not on the servers it watches. When something is red in three rounds a minute apart
# the job fails, and GitHub emails the person who last changed the schedule below. A run that does not happen at all is not seen by this file:
# something outside it has to look at the time of the last run.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      oefenalarm:
        description: "A drill: put a red on purpose, to see that the failed run reaches the owner by email"
        type: boolean
        default: false

# Read only. The job has no reason to write anything, and a step that was changed under us would inherit nothing.
permissions:
  contents: read
  checks: read

# A run that is still going is never cancelled by the next one; a cancelled night looks exactly like a green one.
concurrency:
  group: site-wacht
  cancel-in-progress: false

jobs:
  kijk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Look from the outside
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_WACHT_OEFENALARM: ${{ inputs.oefenalarm && '1' || '0' }}
        run: node scripts/site-wacht.mjs --json "$RUNNER_TEMP/status.json"

      - name: The public summary of this run
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/status.json" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/status.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
