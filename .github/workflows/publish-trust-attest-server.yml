name: Publish trust-attest-server

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/trust-attest-server/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/trust-attest-server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing + provenance need npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Build capacity-attest (workspace dependency)
        working-directory: packages/capacity-attest
        run: npm run build

      - name: Build endpoint-attest (workspace dependency)
        working-directory: packages/endpoint-attest
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # Tests run with no TRUST_ATTEST_* env vars set on purpose: this proves
      # the documented ephemeral-fallback path still works (loud warning, not
      # a crash) even in the CI environment that publishes the package.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Auth comes from NPM_TOKEN, not from trusted publishing. Trusted publishing
      # can only authenticate a package that is ALREADY on npm with a configured
      # repo+workflow link, so it cannot create a brand new package name: npm
      # answers E404 on the PUT, which reads like "does not exist" but actually
      # means "not authenticated" (npm masks auth failures as 404). The same trap
      # fires if a package is ever removed from npm, because the trusted-publisher
      # link goes with it. --provenance is unaffected: it signs via GitHub's OIDC
      # (id-token: write), independent of how the publish authenticates.
      # Refuse to ship a package whose own dependencies are not resolvable on
      # npm. Inside this workspace they always resolve, because npm symlinks
      # them, so a green build proves nothing about the person installing it.
      - name: Refuse to publish if our own dependencies are missing from npm
        working-directory: .
        run: node scripts/check-own-deps-published.mjs --package=trust-attest-server

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
