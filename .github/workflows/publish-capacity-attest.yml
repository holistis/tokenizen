name: Publish capacity-attest

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/capacity-attest/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/capacity-attest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm (trusted publishing and provenance need npm 11.5.1 or newer; the npm that ships with Node 24 is new enough)
        run: node -e "const v=require('child_process').execSync('npm --version').toString().trim().split('.').map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1)))){console.error('npm too old: '+v.join('.'));process.exit(1)}"

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Build net-guard (workspace dependency)
        working-directory: packages/net-guard
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Refuse to ship a package whose own dependencies are not resolvable on
      # npm. Inside this workspace they always resolve, because npm symlinks
      # them, so a green build proves nothing about the person installing it.
      - name: Refuse to publish if our own dependencies are missing from npm
        working-directory: .
        run: node scripts/check-own-deps-published.mjs --package=capacity-attest

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
