name: Publish capacity-attest

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/capacity-attest/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/capacity-attest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing + provenance need npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Refuse to ship a package whose own dependencies are not resolvable on
      # npm. Inside this workspace they always resolve, because npm symlinks
      # them, so a green build proves nothing about the person installing it.
      - name: Refuse to publish if our own dependencies are missing from npm
        working-directory: .
        run: node scripts/check-own-deps-published.mjs --package=capacity-attest

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
