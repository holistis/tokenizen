name: Publish capacity-attest

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/capacity-attest/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/capacity-attest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing + provenance need npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies (workspace root)
        working-directory: .
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
